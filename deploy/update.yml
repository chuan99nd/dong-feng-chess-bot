---
# deploy/update.yml — Pull latest code + restart services (fast, no dep reinstall).
#
# Usage:
#   git push origin main            # push your code FIRST — this pulls origin/main
#   cd deploy && ansible-playbook update.yml --ask-become-pass
#
# Use this when you've only changed Python/web code (e.g. the training monitor or
# model architecture) and want it live without re-running the full setup.yml
# (which also reinstalls PyTorch/deps). Training auto-resumes from runs/<id>/ckpt.pt.
#
# Code ships via GitHub: the server does a `git pull` of `repo_branch`, so ALWAYS
# `git push` your changes before running this — uncommitted/unpushed local edits
# will NOT go live. (GitHub round-trip is intentional: keeps the server tree a
# clean fast-forward and avoids rsync conflicts.)

- name: Dong Feng — Update code + restart
  hosts: gpu
  become: true
  gather_facts: false
  vars:
    app_user: ezycloudx-admin
    app_dir: /home/{{ app_user }}/dong-feng
    repo_branch: main

  tasks:
    - name: Pull latest code from GitHub
      git:
        repo: https://github.com/chuan99nd/dong-feng-chess-bot.git
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true
      become_user: "{{ app_user }}"

    - name: Sync Python deps (fast if unchanged)
      shell: |
        export PATH="/home/{{ app_user }}/.local/bin:$PATH"
        cd {{ app_dir }}
        uv sync --extra model --extra dev
      become_user: "{{ app_user }}"
      environment:
        UV_PYTHON: python3.11

    # Restart via `sudo systemctl …` (not the systemd module) so it matches the
    # restricted NOPASSWD rule from nopasswd-sudo.yml — no password prompt needed.
    # (become: false — the command calls sudo itself.)
    - name: Reload systemd + restart services
      become: false
      command: "/usr/bin/sudo -n /usr/bin/systemctl {{ item }}"
      loop:
        - daemon-reload
        - restart dongfeng-web
        - restart dongfeng-train

    - name: Show service status (is-active needs no root)
      become: false
      shell: >
        systemctl is-active dongfeng-web dongfeng-train dongfeng-tunnel
      register: svc
      ignore_errors: true

    - name: Display status
      debug:
        var: svc.stdout_lines
