# deploy/monitoring/prometheus.yml — Prometheus scrape config for Dong Feng.
#
# Scrapes four local targets (all bound to loopback / localhost on the GPU box):
#   * prometheus itself        :9090
#   * node_exporter (system)   :9100
#   * nvidia gpu exporter      :9835
#   * dongfeng metrics exporter:9105  (`dfc metrics-export`, training runs)
#
# The TSDB data lives OUTSIDE this file, under {{ app_dir }}/monitoring/prometheus-data
# (see deploy/observability.yml --storage.tsdb.path), so it is backed up alongside
# checkpoints/ and runs/ by deploy/backup.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: dongfeng

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: gpu
    static_configs:
      - targets: ["127.0.0.1:9835"]

  - job_name: dongfeng
    static_configs:
      - targets: ["127.0.0.1:9105"]
