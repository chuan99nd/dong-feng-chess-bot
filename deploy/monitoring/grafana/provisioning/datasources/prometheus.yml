# deploy/monitoring/grafana/provisioning/datasources/prometheus.yml
# Auto-provisions the Prometheus datasource so Grafana works with zero clicks.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: dongfeng-prom
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
