---
# deploy/start-train.yml — Start (or restart) training on the GPU server.
#
# Usage:
#   cd deploy && ansible-playbook start-train.yml --ask-become-pass
#   cd deploy && ansible-playbook start-train.yml --ask-become-pass -e train_preset=1b -e train_steps=50000
#
# Training auto-resumes: dfc train-board detects an existing runs/<id>/ckpt.pt
# and continues from its step. On a fresh machine, this playbook first pushes the
# latest checkpoint mirror from this Mac up to the server (if one exists).

- name: Dong Feng — Start training
  hosts: gpu
  become: true
  vars:
    app_user: ezycloudx-admin
    app_dir: /home/{{ app_user }}/dong-feng
    data_remote: "{{ app_dir }}/data/vietcotuong-board-aug"
    train_preset: mid
    train_steps: 100000
    train_batch: 256
    gpu_tag: 5090
    ckpt_local: "{{ playbook_dir }}/../checkpoints"
    runs_local: "{{ playbook_dir }}/../runs"

  tasks:
    - name: Check for a local checkpoint mirror on the Mac
      delegate_to: localhost
      become: false
      stat:
        path: "{{ ckpt_local }}"
      register: ckpt_local_stat

    - name: Push local runs up to the server (so training can resume)
      synchronize:
        src: "{{ runs_local }}/"
        dest: "{{ app_dir }}/runs/"
      become_user: "{{ app_user }}"
      when: ckpt_local_stat.stat.exists
      ignore_errors: true

    - name: Update training service with current params
      copy:
        dest: /etc/systemd/system/dongfeng-train.service
        content: |
          [Unit]
          Description=Dong Feng Board Transformer Training
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          Environment=PATH=/home/{{ app_user }}/.local/bin:/usr/local/bin:/usr/bin:/bin
          ExecStart=/home/{{ app_user }}/.local/bin/uv run dfc train-board --data {{ data_remote }} --preset {{ train_preset }} --steps {{ train_steps }} --batch {{ train_batch }} --device cuda --grad-checkpoint --id board-{{ gpu_tag }}-{{ train_preset }}
          Restart=no
          StandardOutput=append:{{ app_dir }}/runs/train.log
          StandardError=append:{{ app_dir }}/runs/train.log

          [Install]
          WantedBy=multi-user.target

    - name: Restart training service
      systemd:
        name: dongfeng-train
        state: restarted
        daemon_reload: true

    - name: Show training status
      shell: sleep 3 && systemctl status dongfeng-train --no-pager -l | head -20
      register: train_status

    - name: Display status
      debug:
        var: train_status.stdout_lines
